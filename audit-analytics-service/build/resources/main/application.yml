server:
  port: 8087

spring:
  application:
    name: audit-analytics-service
  datasource:
    url: ${AUDIT_DATASOURCE_URL:jdbc:postgresql://localhost:5432/audit_analytics_db}
    username: ${AUDIT_DATASOURCE_USERNAME:audit}
    password: ${AUDIT_DATASOURCE_PASSWORD:audit}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

