services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  clamav:
    image: clamav/clamav:1.5
    ports:
      - "3310:3310"

  api-gateway:
    build:
      context: .
      args:
        JAR_FILE: api-gateway/build/libs/api-gateway-0.1.0-SNAPSHOT.jar
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      FILESYSTEM_SERVICE_URL: http://filesystem-service:8082
      UPLOAD_SERVICE_URL: http://upload-service:8083
      DOWNLOAD_SERVICE_URL: http://download-service:8084
      AUDIT_SERVICE_URL: http://audit-analytics-service:8087
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - filesystem-service
      - upload-service
      - download-service
      - audit-analytics-service

  identity-service:
    build:
      context: .
      args:
        JAR_FILE: identity-service/build/libs/identity-service-0.1.0-SNAPSHOT.jar
    environment:
      IDENTITY_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      IDENTITY_DATASOURCE_USERNAME: identity
      IDENTITY_DATASOURCE_PASSWORD: identity
    depends_on:
      postgres:
        condition: service_healthy

  filesystem-service:
    build:
      context: .
      args:
        JAR_FILE: filesystem-service/build/libs/filesystem-service-0.1.0-SNAPSHOT.jar
    environment:
      FILESYSTEM_DATASOURCE_URL: jdbc:postgresql://postgres:5432/filesystem_db
      FILESYSTEM_DATASOURCE_USERNAME: filesystem
      FILESYSTEM_DATASOURCE_PASSWORD: filesystem
      INTERNAL_SERVICE_TOKEN: dev-internal-token
    depends_on:
      postgres:
        condition: service_healthy

  upload-service:
    build:
      context: .
      args:
        JAR_FILE: upload-service/build/libs/upload-service-0.1.0-SNAPSHOT.jar
    environment:
      UPLOAD_DATASOURCE_URL: jdbc:postgresql://postgres:5432/upload_db
      UPLOAD_DATASOURCE_USERNAME: upload
      UPLOAD_DATASOURCE_PASSWORD: upload
      FILESYSTEM_SERVICE_URL: http://filesystem-service:8082
      INTERNAL_SERVICE_TOKEN: dev-internal-token
      DEV_STORAGE_URL: http://minio:9000/file-storage
    depends_on:
      postgres:
        condition: service_healthy
      filesystem-service:
        condition: service_started

  download-service:
    build:
      context: .
      args:
        JAR_FILE: download-service/build/libs/download-service-0.1.0-SNAPSHOT.jar
    environment:
      DOWNLOAD_DATASOURCE_URL: jdbc:postgresql://postgres:5432/download_db
      DOWNLOAD_DATASOURCE_USERNAME: download
      DOWNLOAD_DATASOURCE_PASSWORD: download
      FILESYSTEM_SERVICE_URL: http://filesystem-service:8082
      INTERNAL_SERVICE_TOKEN: dev-internal-token
      DEV_STORAGE_URL: http://minio:9000/file-storage
    depends_on:
      postgres:
        condition: service_healthy
      filesystem-service:
        condition: service_started

  virus-scan-service:
    build:
      context: .
      args:
        JAR_FILE: virus-scan-service/build/libs/virus-scan-service-0.1.0-SNAPSHOT.jar
    environment:
      FILESYSTEM_SERVICE_URL: http://filesystem-service:8082
      INTERNAL_SERVICE_TOKEN: dev-internal-token
    depends_on:
      - filesystem-service
      - redis
      - clamav

  notification-service:
    build:
      context: .
      args:
        JAR_FILE: notification-service/build/libs/notification-service-0.1.0-SNAPSHOT.jar
    environment:
      NOTIFICATION_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DATASOURCE_USERNAME: notification
      NOTIFICATION_DATASOURCE_PASSWORD: notification
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  audit-analytics-service:
    build:
      context: .
      args:
        JAR_FILE: audit-analytics-service/build/libs/audit-analytics-service-0.1.0-SNAPSHOT.jar
    environment:
      AUDIT_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_analytics_db
      AUDIT_DATASOURCE_USERNAME: audit
      AUDIT_DATASOURCE_PASSWORD: audit
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

