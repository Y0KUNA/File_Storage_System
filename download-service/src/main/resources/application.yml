server:
  port: 8084

app:
  filesystem-url: ${FILESYSTEM_SERVICE_URL:http://localhost:8082}
  internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  kafka:
    events-topic: ${KAFKA_EVENTS_TOPIC:file-storage.events}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minio}
    secret-key: ${MINIO_SECRET_KEY:minio123}
    bucket: ${MINIO_BUCKET:file-storage}
    presign-expiry-minutes: ${MINIO_PRESIGN_EXPIRY_MINUTES:15}

spring:
  application:
    name: download-service
  datasource:
    url: ${DOWNLOAD_DATASOURCE_URL:jdbc:postgresql://localhost:5432/download_db}
    username: ${DOWNLOAD_DATASOURCE_USERNAME:download}
    password: ${DOWNLOAD_DATASOURCE_PASSWORD:download}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
