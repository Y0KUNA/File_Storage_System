server:
  port: 8086

app:
  kafka:
    events-topic: ${KAFKA_EVENTS_TOPIC:file-storage.events}
    dlq-suffix: ${KAFKA_DLQ_SUFFIX:.DLQ}
    dedupe-ttl-hours: ${KAFKA_DEDUPE_TTL_HOURS:72}

spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${NOTIFICATION_DATASOURCE_USERNAME:notification}
    password: ${NOTIFICATION_DATASOURCE_PASSWORD:notification}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.filestorage.common
        spring.json.value.default.type: com.filestorage.common.EventEnvelope
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
