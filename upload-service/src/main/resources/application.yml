server:
  port: 8083

app:
  filesystem-url: ${FILESYSTEM_SERVICE_URL:http://localhost:8082}
  internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  multipart-threshold-bytes: ${MULTIPART_THRESHOLD_BYTES:104857600}
  part-size-bytes: ${UPLOAD_PART_SIZE_BYTES:10485760}
  upload-abort-ttl-minutes: ${UPLOAD_ABORT_TTL_MINUTES:1440}
  upload-cleanup-delay-ms: ${UPLOAD_CLEANUP_DELAY_MS:300000}
  kafka:
    events-topic: ${KAFKA_EVENTS_TOPIC:file-storage.events}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minio}
    secret-key: ${MINIO_SECRET_KEY:minio123}
    bucket: ${MINIO_BUCKET:file-storage}
    presign-expiry-minutes: ${MINIO_PRESIGN_EXPIRY_MINUTES:15}

spring:
  application:
    name: upload-service
  datasource:
    url: ${UPLOAD_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upload_db}
    username: ${UPLOAD_DATASOURCE_USERNAME:upload}
    password: ${UPLOAD_DATASOURCE_PASSWORD:upload}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
